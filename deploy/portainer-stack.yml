# AccrediHub — paste this into Portainer > Stacks > Add stack > Web editor.
# Change the 3 things marked  <-- CHANGE ME
services:
  accredihub:
    image: ghcr.io/YOUR_GITHUB_USERNAME/accredihub:latest   # <-- CHANGE ME (lowercase username)
    container_name: accredihub
    restart: unless-stopped
    ports:
      - "3000:3000"            # left side = port on your TrueNAS; change if 3000 is taken
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-please                       # <-- CHANGE ME
      SESSION_SECRET: change-me-to-a-long-random-string      # <-- CHANGE ME (any long random text)
      TZ: Europe/London
      # Optional integrations — leave blank to switch them off:
      NAVIDROME_URL: ""        # e.g. http://192.168.1.50:4533
      NAVIDROME_USERNAME: ""
      NAVIDROME_PASSWORD: ""
      BANDSINTOWN_APP_ID: ""
      TICKETMASTER_API_KEY: ""
      # Set to "true" only if you serve AccrediHub over https:
      COOKIE_SECURE: "false"
    volumes:
      # Database + uploaded images. Point this at a dataset on your pool.
      - /mnt/tank/apps/accredihub:/data                     # <-- CHANGE ME if your pool isn't called "tank"
