<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist — AccrediHub</title>
<link rel="stylesheet" href="/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/app.js"></script>
<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main" x-data="artistPage()" x-init="init()" x-cloak>
    <template x-if="loading"><div class="page-sub">Loading artist…</div></template>

    <template x-if="!loading && !artist">
      <div class="empty-state panel"><p>Artist not found.</p></div>
    </template>

    <template x-if="!loading && artist">
      <div>
        <div class="hero-panel fade-in" style="display:flex;gap:24px;align-items:center;margin-bottom:32px;flex-wrap:wrap">
          <div class="artist-photo" style="width:130px;flex-shrink:0" :style="artist.photo_url ? 'width:130px;background-image:url(' + artist.photo_url + ');background-size:cover;background-position:center' : 'width:130px'">
            <template x-if="!artist.photo_url"><span x-text="SR.initials(artist.name)"></span></template>
          </div>
          <div style="flex:1;min-width:220px">
            <div class="page-title" style="display:flex;align-items:center;gap:9px">
              <span x-text="artist.name"></span>
              <template x-if="artist.is_ai_artist">
                <span title="AI Artist" style="display:inline-flex;color:#e0a721;flex-shrink:0">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </span>
              </template>
              <template x-if="artist.is_profile_complete">
                <span title="Artist Profile Complete" style="display:inline-flex;color:#22c55e;flex-shrink:0">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
              </template>
            </div>
            <div class="page-sub" style="margin-top:4px" x-show="artistMetaLine()" x-text="artistMetaLine()"></div>
            <p class="page-sub" style="max-width:560px;margin-top:8px" x-text="artist.bio || 'No bio yet.'"></p>
          </div>
          <button class="btn btn-ghost" @click="openEditArtist()">Edit artist</button>
        </div>

        <div class="section">
          <div class="section-head">
            <div class="section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
              PR Contact
            </div>
            <button class="btn btn-ghost btn-sm" @click="openAddPr()">Add PR contact</button>
          </div>
          <template x-if="prContacts.length === 0">
            <div class="panel" style="color:var(--text-faint);font-size:13.5px">No PR contact on file.</div>
          </template>
          <template x-for="pc in prContacts" :key="pc.id">
            <div class="track-row">
              <div class="art" style="width:44px;height:44px;border-radius:10px">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="18" height="18"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
              </div>
              <div class="track-main">
                <div class="track-title" x-text="pc.agency_company"></div>
                <div class="track-meta" x-text="[pc.contact_name, pc.contact_email].filter(Boolean).join(' · ') || 'No named contact'"></div>
              </div>
              <div class="track-col" x-text="pc.contact_phone || ''"></div>
              <div class="track-actions">
                <template x-if="pc.contact_email">
                  <a :href="'mailto:' + pc.contact_email" class="icon-btn" title="Email">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg>
                  </a>
                </template>
                <div class="icon-btn" @click="openEditPr(pc)" title="Edit">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </div>
                <div class="icon-btn" @click="removePr(pc)" title="Remove">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </div>
              </div>
            </div>
          </template>
        </div>

        <div class="section">
          <div class="section-head">
            <div class="section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
              Upcoming Tour Dates
            </div>
            <button class="btn btn-ghost btn-sm" @click="openAddTour()">Add date</button>
          </div>
          <template x-if="tourDates.length === 0">
            <div class="panel" style="color:var(--text-faint);font-size:13.5px">No upcoming tour dates.</div>
          </template>
          <template x-for="td in tourDates" :key="td.id">
            <div class="track-row">
              <div class="art" style="width:44px;height:44px;border-radius:10px">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="18" height="18"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
              </div>
              <div class="track-main">
                <div class="track-title" x-text="(td.venue || 'Venue TBA') + (td.city ? ' — ' + td.city : '')"></div>
                <div class="track-meta" x-text="SR.fmtDate(td.event_date)"></div>
              </div>
              <span class="pill" :class="statusPillClass(td.status)" x-text="statusLabel(td.status)"></span>
              <div class="track-col" x-text="td.attendee_count + ' going'"></div>
              <div class="track-actions">
                <div class="icon-btn" :class="td.is_attending && 'active'" @click="toggleAttending(td)" :title="td.is_attending ? 'You\'re going — click to cancel' : 'I\'m attending'">
                  <svg viewBox="0 0 24 24" :fill="td.is_attending ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
                </div>
                <template x-if="td.ticket_url"><a :href="td.ticket_url" target="_blank" class="pill pill-accent">Tickets</a></template>
                <div class="icon-btn" @click="openEditTour(td)" title="Edit">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </div>
                <div class="icon-btn" @click="removeTourDate(td)" title="Remove">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </div>
              </div>
            </div>
          </template>
        </div>

        <div class="section">
          <div class="section-head">
            <div class="section-title">Albums</div>
            <span class="section-count" x-text="totalTracks + ' track' + (totalTracks === 1 ? '' : 's')"></span>
          </div>
          <template x-if="albums.length === 0 && singles.length === 0">
            <div class="panel" style="color:var(--text-faint);font-size:13.5px">No tracks yet for this artist.</div>
          </template>
          <template x-for="album in albums" :key="album.album_name">
            <div style="display:flex;gap:18px;align-items:flex-start;margin-bottom:30px">
              <div class="art album-art" :style="album.album_art_url ? 'background-image:url(' + album.album_art_url + ')' : ''">
                <template x-if="!album.album_art_url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" width="72" height="72"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg></template>
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;font-size:15px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px">
                  <span x-text="album.album_name"></span>
                  <span class="section-count" x-text="SR.fmtDate(album.release_date)"></span>
                </div>
                <template x-for="t in album.tracks" :key="t.id">
                  <div class="track-row" :class="{ 'is-navidrome-only': t.navidrome_only }" :title="t.navidrome_only ? 'In Navidrome but not yet added to AccrediHub — edit it to add it properly' : ''">
                    <div class="track-no" style="width:34px;flex:none;text-align:right;color:var(--muted,#888);font-variant-numeric:tabular-nums" x-text="t.track_number ? ((album.multiDisc ? (t.disc_number || 1) + '.' : '') + t.track_number) : ''"></div>
                    <div class="track-main"><div class="track-title" x-text="t.title"></div></div>
                    <div class="theme-pills" x-show="t.themes && t.themes.length">
                      <template x-for="th in t.themes" :key="th.id">
                        <span class="pill pill-theme" x-text="th.name"></span>
                      </template>
                    </div>
                    <div class="track-col" x-text="SR.fmtDate(t.release_date) || '—'"></div>
                    <div class="track-actions">
                      <template x-if="t.navidrome_url">
                        <a :href="t.navidrome_url" target="_blank" class="icon-btn" title="Play in Navidrome" style="color:#22c55e" @click.stop>
                          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                        </a>
                      </template>
                      <div class="icon-btn" @click="openEditTrack(t)" title="Edit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                      </div>
                      <div class="icon-btn" @click="removeTrack(t)" title="Delete">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <template x-if="singles.length">
            <div :style="albums.length ? 'margin-top:8px' : ''">
              <div style="font-weight:700;font-size:15px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px">
                <span>Singles</span>
                <span class="section-count" x-text="singles.length + ' track' + (singles.length === 1 ? '' : 's')"></span>
              </div>
              <template x-for="t in singles" :key="t.id">
                <div class="track-row" :class="{ 'is-navidrome-only': t.navidrome_only }" :title="t.navidrome_only ? 'In Navidrome but not yet added to AccrediHub — edit it to add it properly' : ''">
                  <div class="art art-single" :style="t.album_art_url ? 'background-image:url(' + t.album_art_url + ')' : ''">
                    <template x-if="!t.album_art_url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg></template>
                  </div>
                  <div class="track-main"><div class="track-title" x-text="t.title"></div></div>
                  <div class="theme-pills" x-show="t.themes && t.themes.length">
                    <template x-for="th in t.themes" :key="th.id">
                      <span class="pill pill-theme" x-text="th.name"></span>
                    </template>
                  </div>
                  <div class="track-col" x-text="SR.fmtDate(t.release_date) || '—'"></div>
                  <div class="track-actions">
                    <template x-if="t.navidrome_url">
                      <a :href="t.navidrome_url" target="_blank" class="icon-btn" title="Play in Navidrome" style="color:#22c55e" @click.stop>
                        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                      </a>
                    </template>
                    <div class="icon-btn" @click="openEditTrack(t)" title="Edit">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </div>
                    <div class="icon-btn" @click="removeTrack(t)" title="Delete">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Edit artist modal -->
    <div class="modal-backdrop" x-show="editOpen" x-cloak @click.self="editOpen = false">
      <div class="modal">
        <div class="modal-title">Edit Artist</div>
        <form @submit.prevent="saveArtist()">
          <label class="field-label">Name</label>
          <input class="input" style="margin-bottom:14px" x-model="editForm.name" required>
          <label class="field-label">Bio</label>
          <textarea class="input" style="margin-bottom:14px;min-height:80px" x-model="editForm.bio"></textarea>
          <label class="field-label">Location</label>
          <input class="input" style="margin-bottom:14px" x-model="editForm.location" placeholder="City, Country">
          <div style="display:flex;gap:10px;margin-bottom:14px">
            <div style="flex:1">
              <label class="field-label">Year formed</label>
              <input class="input" type="number" x-model="editForm.year_formed" placeholder="e.g. 2005">
            </div>
            <div style="flex:1">
              <label class="field-label">Year split</label>
              <input class="input" type="number" x-model="editForm.year_split" placeholder="If disbanded">
            </div>
          </div>
          <label class="field-label">Photo</label>
          <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
            <input class="input" x-model="editForm.photo_url" style="flex:1">
            <input type="file" accept="image/*" x-ref="photoFile" @change="uploadPhoto($event)" style="display:none">
            <button type="button" class="btn btn-ghost btn-sm" @click="$refs.photoFile.click()">Upload</button>
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13.5px;cursor:pointer">
            <input type="checkbox" x-model="editForm.is_ai_artist" style="width:16px;height:16px">
            AI Artist
          </label>
          <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13.5px;cursor:pointer">
            <input type="checkbox" x-model="editForm.is_profile_complete" style="width:16px;height:16px">
            Artist Profile Complete
          </label>
          <div style="display:flex;justify-content:space-between;gap:10px">
            <button type="button" class="btn btn-danger" @click="deleteArtist()">Delete artist</button>
            <div style="display:flex;gap:10px">
              <button type="button" class="btn btn-ghost" @click="editOpen = false">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="saving" x-text="saving ? 'Saving…' : 'Save'"></button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Add / edit tour date modal -->
    <div class="modal-backdrop" x-show="tourFormOpen" x-cloak @click.self="tourFormOpen = false">
      <div class="modal">
        <div class="modal-title" x-text="editingTourId ? 'Edit Tour Date' : 'Add Tour Date'"></div>
        <form @submit.prevent="saveTourDate()">
          <label class="field-label">Date</label>
          <input class="input" style="margin-bottom:14px" type="date" x-model="tourForm.event_date" required>
          <label class="field-label">Venue</label>
          <input class="input" style="margin-bottom:14px" x-model="tourForm.venue" placeholder="Venue name">
          <label class="field-label">City</label>
          <input class="input" style="margin-bottom:14px" x-model="tourForm.city" placeholder="City">
          <label class="field-label">Ticket link (optional)</label>
          <input class="input" style="margin-bottom:14px" x-model="tourForm.ticket_url" placeholder="https://…">
          <label class="field-label">Status</label>
          <select class="input" style="margin-bottom:16px" x-model="tourForm.status">
            <option value="new">New</option>
            <option value="applied">Applied</option>
            <option value="awaiting">Awaiting</option>
            <option value="approved">Approved</option>
            <option value="denied">Denied</option>
          </select>
          <div style="display:flex;justify-content:flex-end;gap:10px">
            <button type="button" class="btn btn-ghost" @click="tourFormOpen = false">Cancel</button>
            <button type="submit" class="btn btn-primary" :disabled="saving" x-text="saving ? 'Saving…' : 'Save'"></button>
          </div>
        </form>
      </div>
    </div>

    <!-- Add/edit PR contact modal -->
    <div class="modal-backdrop" x-show="prFormOpen" x-cloak @click.self="prFormOpen = false">
      <div class="modal">
        <div class="modal-title" x-text="editingPrId ? 'Edit PR Contact' : 'Add PR Contact'"></div>
        <form @submit.prevent="savePr()">
          <label class="field-label">PR Agency</label>
          <input class="input" style="margin-bottom:14px" x-model="prForm.agency_company" required placeholder="Agency / company name" list="agency-suggestions">
          <datalist id="agency-suggestions">
            <template x-for="ag in allAgencies" :key="ag.id"><option :value="ag.company"></option></template>
          </datalist>
          <label class="field-label">Contact name (optional)</label>
          <input class="input" style="margin-bottom:14px" x-model="prForm.contact_name" placeholder="Named contact at the agency">
          <label class="field-label">Contact email (optional)</label>
          <input class="input" style="margin-bottom:14px" x-model="prForm.contact_email" placeholder="name@agency.com">
          <label class="field-label">Contact phone (optional)</label>
          <input class="input" style="margin-bottom:14px" x-model="prForm.contact_phone" placeholder="+44…">
          <label class="field-label">Notes (optional)</label>
          <textarea class="input" style="margin-bottom:16px;min-height:60px" x-model="prForm.notes"></textarea>
          <div style="display:flex;justify-content:flex-end;gap:10px">
            <button type="button" class="btn btn-ghost" @click="prFormOpen = false">Cancel</button>
            <button type="submit" class="btn btn-primary" :disabled="saving" x-text="saving ? 'Saving…' : 'Save'"></button>
          </div>
        </form>
      </div>
    </div>

    <!-- Edit track modal -->
    <div class="modal-backdrop" x-show="trackFormOpen" x-cloak @click.self="trackFormOpen = false">
      <div class="modal">
        <div class="modal-title">Edit Track</div>
        <form @submit.prevent="saveTrack()">
          <label class="field-label">Track title</label>
          <input class="input" style="margin-bottom:14px" x-model="trackForm.title" required placeholder="Track title">

          <label class="field-label">Artist</label>
          <input class="input" style="margin-bottom:14px" x-model="trackForm.artist_name" required placeholder="Artist name" list="artist-suggestions">
          <datalist id="artist-suggestions">
            <template x-for="a in allArtists" :key="a.id"><option :value="a.name"></option></template>
          </datalist>

          <label class="field-label">Album (optional)</label>
          <input class="input" style="margin-bottom:14px" x-model="trackForm.album_name" placeholder="Album name">

          <label class="field-label">Release date (optional)</label>
          <input class="input" style="margin-bottom:14px" type="date" x-model="trackForm.release_date">

          <label class="field-label">Album art</label>
          <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
            <div class="art" :style="trackForm.album_art_url ? 'background-image:url(' + trackForm.album_art_url + ')' : ''" style="width:44px;height:44px"></div>
            <input class="input" x-model="trackForm.album_art_url" placeholder="Image URL, or upload →" style="flex:1">
            <input type="file" accept="image/*" x-ref="trackArtFile" @change="uploadTrackArt($event)" style="display:none">
            <button type="button" class="btn btn-ghost btn-sm" @click="$refs.trackArtFile.click()" :disabled="uploadingArt" x-text="uploadingArt ? '…' : 'Upload'"></button>
          </div>

          <label class="field-label">Themes (what the song is about)</label>
          <div class="chip-input-row" style="margin-bottom:16px">
            <template x-for="name in trackForm.themes" :key="name">
              <span class="pill pill-theme pill-removable" @click="removeTheme(name)" title="Remove theme">
                <span x-text="name"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </span>
            </template>
            <input placeholder="Add a theme, press Enter…" x-model="themeInput" list="theme-suggestions"
                   @keydown.enter.prevent="addTheme()" @blur="addTheme()">
          </div>
          <datalist id="theme-suggestions">
            <template x-for="th in allThemes" :key="th.id"><option :value="th.name"></option></template>
          </datalist>

          <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
            <button type="button" class="btn btn-ghost" @click="trackFormOpen = false">Cancel</button>
            <button type="submit" class="btn btn-primary" :disabled="saving" x-text="saving ? 'Saving…' : 'Save'"></button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script>
function artistPage() {
  const id = new URLSearchParams(location.search).get('id');
  return {
    id, artist: null, albums: [], singles: [], tourDates: [], prContacts: [], loading: true, totalTracks: 0,
    allArtists: [], allThemes: [], allAgencies: [], themeInput: '', saving: false, uploadingArt: false,
    editOpen: false, editForm: { name: '', bio: '', photo_url: '', location: '', year_formed: '', year_split: '', is_ai_artist: false, is_profile_complete: false },
    tourFormOpen: false, editingTourId: null, tourForm: { event_date: '', venue: '', city: '', ticket_url: '', status: 'new' },
    prFormOpen: false, editingPrId: null, prForm: { agency_company: '', contact_name: '', contact_email: '', contact_phone: '', notes: '' },
    trackFormOpen: false, editingTrackId: null, trackForm: { title: '', artist_name: '', album_name: '', release_date: '', album_art_url: '', themes: [] },

    async init() {
      const user = await SR.requireAuth();
      if (!user) return;
      SR.mountSidebar('artists', user);
      await this.loadArtists();
      await this.loadThemes();
      await this.loadAgencies();
      await this.load();
    },
    async loadArtists() {
      try { const r = await SR.api('/artists'); this.allArtists = r.artists || []; } catch (e) {}
    },
    async loadThemes() {
      try { const r = await SR.api('/themes'); this.allThemes = r.themes || []; } catch (e) {}
    },
    async loadAgencies() {
      try { const r = await SR.api('/pr-agencies'); this.allAgencies = r.agencies || []; } catch (e) {}
    },
    statusLabel(status) {
      return { new: 'New', applied: 'Applied', awaiting: 'Awaiting', approved: 'Approved', denied: 'Denied' }[status] || 'New';
    },
    statusPillClass(status) {
      return { new: '', applied: 'pill-accent', awaiting: 'pill-warning', approved: 'pill-success', denied: 'pill-danger' }[status] || '';
    },
    addTheme() {
      const raw = (this.themeInput || '').replace(/\s+/g, ' ').trim();
      this.themeInput = '';
      if (!raw) return;
      if (this.trackForm.themes.some(n => n.toLowerCase() === raw.toLowerCase())) return;
      this.trackForm.themes.push(raw);
    },
    removeTheme(name) {
      this.trackForm.themes = this.trackForm.themes.filter(n => n !== name);
    },
    async load() {
      this.loading = true;
      try {
        const r = await SR.api('/artists/' + this.id);
        this.artist = r.artist;
        this.albums = r.albums || [];
        this.singles = r.singles || [];
        this.tourDates = r.tour_dates || [];
        this.prContacts = r.pr_contacts || [];
        this.totalTracks = this.albums.reduce((n, a) => n + a.tracks.length, 0) + this.singles.length;
      } catch (e) { SR.toast(e.message); }
      this.loading = false;
    },
    artistMetaLine() {
      const a = this.artist;
      if (!a) return '';
      const parts = [];
      if (a.location) parts.push(a.location);
      if (a.year_formed && a.year_split) parts.push(a.year_formed + '–' + a.year_split);
      else if (a.year_formed) parts.push('Formed ' + a.year_formed);
      else if (a.year_split) parts.push('Split ' + a.year_split);
      return parts.join(' · ');
    },
    openEditArtist() {
      this.editForm = {
        name: this.artist.name,
        bio: this.artist.bio || '',
        photo_url: this.artist.photo_url || '',
        location: this.artist.location || '',
        year_formed: this.artist.year_formed || '',
        year_split: this.artist.year_split || '',
        is_ai_artist: !!this.artist.is_ai_artist,
        is_profile_complete: !!this.artist.is_profile_complete,
      };
      this.editOpen = true;
    },
    async uploadPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('kind', 'artist');
        const r = await SR.api('/uploads', { method: 'POST', body: fd });
        this.editForm.photo_url = r.url;
      } catch (err) { SR.toast(err.message); }
    },
    async saveArtist() {
      this.saving = true;
      try {
        await SR.api('/artists/' + this.id, { method: 'PUT', body: this.editForm });
        this.editOpen = false;
        await this.load();
        SR.toast('Saved.');
      } catch (e) { SR.toast(e.message); }
      this.saving = false;
    },
    async deleteArtist() {
      if (!confirm('Delete this artist and all their tracks?')) return;
      try {
        await SR.api('/artists/' + this.id, { method: 'DELETE' });
        location.href = '/artists.html';
      } catch (e) { SR.toast(e.message); }
    },
    openAddTour() {
      this.editingTourId = null;
      this.tourForm = { event_date: '', venue: '', city: '', ticket_url: '', status: 'new' };
      this.tourFormOpen = true;
    },
    openEditTour(td) {
      this.editingTourId = td.id;
      this.tourForm = { event_date: td.event_date || '', venue: td.venue || '', city: td.city || '', ticket_url: td.ticket_url || '', status: td.status || 'new' };
      this.tourFormOpen = true;
    },
    async saveTourDate() {
      this.saving = true;
      try {
        if (this.editingTourId) {
          await SR.api('/tour-dates/' + this.editingTourId, { method: 'PUT', body: this.tourForm });
        } else {
          await SR.api('/tour-dates', { method: 'POST', body: { artist_id: this.id, ...this.tourForm } });
        }
        this.tourFormOpen = false;
        this.editingTourId = null;
        this.tourForm = { event_date: '', venue: '', city: '', ticket_url: '', status: 'new' };
        await this.load();
        SR.toast('Saved.');
      } catch (e) { SR.toast(e.message); }
      this.saving = false;
    },
    openAddPr() {
      this.editingPrId = null;
      this.prForm = { agency_company: '', contact_name: '', contact_email: '', contact_phone: '', notes: '' };
      this.prFormOpen = true;
    },
    openEditPr(pc) {
      this.editingPrId = pc.id;
      this.prForm = {
        agency_company: pc.agency_company,
        contact_name: pc.contact_name || '',
        contact_email: pc.contact_email || '',
        contact_phone: pc.contact_phone || '',
        notes: pc.notes || '',
      };
      this.prFormOpen = true;
    },
    async savePr() {
      const company = (this.prForm.agency_company || '').trim();
      if (!company) return;
      this.saving = true;
      try {
        const agencyRes = await SR.api('/pr-agencies', { method: 'POST', body: { company } });
        const agencyId = agencyRes.agency.id;
        let contactId = null;
        const contactName = (this.prForm.contact_name || '').trim();
        if (contactName) {
          const contactRes = await SR.api('/pr-contacts', { method: 'POST', body: {
            agency_id: agencyId, name: contactName, email: this.prForm.contact_email, phone: this.prForm.contact_phone,
          }});
          contactId = contactRes.contact.id;
        }
        if (this.editingPrId) {
          await SR.api('/artist-pr-contacts/' + this.editingPrId, { method: 'PUT', body: { agency_id: agencyId, contact_id: contactId, notes: this.prForm.notes } });
        } else {
          await SR.api('/artist-pr-contacts', { method: 'POST', body: { artist_id: this.id, agency_id: agencyId, contact_id: contactId, notes: this.prForm.notes } });
        }
        this.prFormOpen = false;
        await this.loadAgencies();
        await this.load();
        SR.toast('Saved.');
      } catch (e) { SR.toast(e.message); }
      this.saving = false;
    },
    async removePr(pc) {
      if (!confirm('Remove this PR contact?')) return;
      try {
        await SR.api('/artist-pr-contacts/' + pc.id, { method: 'DELETE' });
        this.prContacts = this.prContacts.filter(x => x.id !== pc.id);
      } catch (e) { SR.toast(e.message); }
    },
    async removeTourDate(td) {
      if (!confirm('Remove this tour date?')) return;
      try {
        await SR.api('/tour-dates/' + td.id, { method: 'DELETE' });
        this.tourDates = this.tourDates.filter(x => x.id !== td.id);
      } catch (e) { SR.toast(e.message); }
    },
    async toggleAttending(td) {
      const next = !td.is_attending;
      td.is_attending = next;
      td.attendee_count += next ? 1 : -1;
      try {
        await SR.api('/tour-dates/' + td.id + '/attending', { method: next ? 'POST' : 'DELETE' });
      } catch (e) {
        td.is_attending = !next;
        td.attendee_count += next ? -1 : 1;
        SR.toast(e.message);
      }
    },
    openEditTrack(t) {
      this.editingTrackId = t.id;
      this.themeInput = '';
      this.trackForm = {
        title: t.title,
        artist_name: this.artist.name,
        album_name: t.album_name || '',
        release_date: t.release_date || '',
        album_art_url: t.album_art_url || '',
        themes: (t.themes || []).map(th => th.name),
      };
      this.trackFormOpen = true;
    },
    async uploadTrackArt(e) {
      const file = e.target.files[0];
      if (!file) return;
      this.uploadingArt = true;
      try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('kind', 'album');
        const r = await SR.api('/uploads', { method: 'POST', body: fd });
        this.trackForm.album_art_url = r.url;
      } catch (err) { SR.toast(err.message); }
      this.uploadingArt = false;
    },
    async saveTrack() {
      this.addTheme(); // commit any theme text still sitting in the input
      this.saving = true;
      try {
        await SR.api('/tracks/' + this.editingTrackId, { method: 'PUT', body: this.trackForm });
        this.trackFormOpen = false;
        await this.loadArtists();
        await this.loadThemes();
        await this.load();
        SR.toast('Saved.');
      } catch (e) { SR.toast(e.message); }
      this.saving = false;
    },
    async removeTrack(t) {
      if (!confirm('Delete “' + t.title + '”?')) return;
      try {
        await SR.api('/tracks/' + t.id, { method: 'DELETE' });
        await this.load();
      } catch (e) { SR.toast(e.message); }
    },
  };
}
</script>
</body>
</html>
