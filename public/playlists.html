<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previous Playlists — AccrediHub</title>
<link rel="stylesheet" href="/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/app.js"></script>
<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main" x-data="playlistsPage()" x-init="init()" x-cloak>
    <div class="page-head">
      <div>
        <div class="page-title">Previous Playlists</div>
        <div class="page-sub" x-text="loading ? 'Loading…' : (playlists.length + ' playlist' + (playlists.length === 1 ? '' : 's'))"></div>
      </div>
      <a href="/playlist-builder.html" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New playlist
      </a>
    </div>

    <template x-if="!loading && playlists.length === 0">
      <div class="empty-state panel"><p>No playlists yet — build your first show.</p></div>
    </template>

    <template x-for="p in playlists" :key="p.id">
      <a :href="'/playlist.html?id=' + p.id" class="track-row fade-in" style="padding:16px">
        <div class="art" style="width:44px;height:44px;border-radius:10px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="18" height="18"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>
        </div>
        <div class="track-main">
          <div class="track-title" x-text="p.name"></div>
          <div class="track-meta">
            <span x-text="SR.fmtDate(p.show_date) || 'No date set'"></span>
            <template x-if="p.theme"><span> · <span x-text="p.theme"></span></span></template>
          </div>
        </div>
        <div class="track-col" x-text="p.track_count + ' tracks · ' + p.note_count + ' notes'"></div>
      </a>
    </template>
  </main>
</div>

<script>
function playlistsPage() {
  return {
    playlists: [], loading: true,
    async init() {
      const user = await SR.requireAuth();
      if (!user) return;
      SR.mountSidebar('playlists', user);
      try { const r = await SR.api('/playlists'); this.playlists = r.playlists || []; }
      catch (e) { SR.toast(e.message); }
      this.loading = false;
    },
  };
}
</script>
</body>
</html>
